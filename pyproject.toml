[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "akp02"
version = "1.0.0"
description = "Linux library for the Ajazz AKP02 9.2\" 1920x462 USB HID display"
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
authors = [{ name = "Deon Spengler", email = "deon@spengler.co.za" }]
keywords = ["ajazz", "akp02", "hid", "usb", "display", "panel", "linux"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "Topic :: Multimedia :: Graphics",
    "Typing :: Typed",
]

dependencies = [
    # Image.Resampling / Image.Transpose enums (used in _letterbox and
    # show) landed in Pillow 9.1.
    "pillow>=9.1",
    # MUST be `hidapi`, not the unrelated `hid` package -- both import as
    # `hid` and only this one provides hid.device. AKP02._open detects the
    # mix-up and says so, but pinning it here is what stops it happening.
    "hidapi>=0.14",
]

[project.urls]
Homepage = "https://github.com/deonspengler/akp02"
Issues = "https://github.com/deonspengler/akp02/issues"

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    # The suite is written to be order-independent; this keeps it honest.
    # Nothing in the config depends on it -- the suite runs fine without.
    "pytest-randomly>=3.12",
]
dev = [
    "akp02[test]",
    "mypy>=1.8",
    "ruff>=0.5",
]

# Flat layout: akp02/ sits next to this file. For a src/ layout instead,
# change this to ["src/akp02"].
[tool.hatch.build.targets.wheel]
packages = ["akp02"]

[tool.hatch.build.targets.sdist]
include = ["akp02", "test_akp02.py", "README.md", "udev"]


# ---------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["test_akp02.py"]
addopts = "--strict-markers"
# Hang detector, not a performance budget: no test should take anywhere
# near this long (the whole suite runs in ~1s). If one does, this dumps
# the stack of every live thread, which is exactly what you need to see
# when a keepalive thread or a device lock is the thing that wedged.
#
# This is a built-in pytest option deliberately chosen over the similar
# `timeout` option from the pytest-timeout plugin, so that a bare
# `pip install pytest pillow` produces no "Unknown config option"
# warning. The tradeoff: this reports the hang but does not abort it,
# where the plugin would kill the test outright.
faulthandler_timeout = 60
filterwarnings = [
    # The library warns on abandoned keepalive threads and leaked HID
    # handles. Tests that expect those capture them explicitly, so
    # anything reaching here is an unexpected warning worth failing on.
    "error",
    # Keep pytest's own config warnings as warnings. They are issued
    # before the test run starts, and pytest turns a config-time
    # error into an INTERNALERROR with no readable message -- so a
    # simple typo in a setting above would crash the run instead of
    # explaining itself.
    "default::pytest.PytestConfigWarning",
]


# ---------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # import sorting
    "B",         # bugbear
    "UP",        # pyupgrade
    "SIM",       # simplify
    "RUF",
]
ignore = [
    # The library deliberately swallows exceptions in the keepalive loop
    # (documented: let the main thread discover the dead device) and in
    # test teardown.
    "B904",
]

[tool.ruff.lint.per-file-ignores]
"test_akp02.py" = [
    # Fake devices intentionally implement only the slice of the
    # _HidDevice protocol each test needs, and reach into private
    # attributes to assert on internal state.
    "B011", "SIM117",
]


# ---------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------
[tool.mypy]
# python_version pinned to the actual minimum supported version, so
# mypy checks against 3.11's stdlib/typeshed specifically -- catches
# accidental use of newer-than-3.11 syntax or APIs even when mypy itself
# runs on a later interpreter.
python_version = "3.11"
files = ["akp02", "test_akp02.py"]
strict = true
warn_unreachable = true

# hidapi ships no type stubs -- this is the reason _HidDevice is a
# structural Protocol and why _open ends in a cast().
[[tool.mypy.overrides]]
module = ["hid", "hid.*"]
ignore_missing_imports = true

# The test doubles are duck-typed against _HidDevice on purpose, the
# fixtures are untyped, and two tests reassign akp02.time to a stand-in
# clock. Strict mode has nothing useful to say about any of that.
[[tool.mypy.overrides]]
module = ["test_akp02"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disable_error_code = ["attr-defined"]
